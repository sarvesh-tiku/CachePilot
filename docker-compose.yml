services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cachepilot
      POSTGRES_PASSWORD: cachepilot
      POSTGRES_DB: cachepilot
    ports:
      - "5432:5432"
    volumes:
      - cachepilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cachepilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CACHEPILOT_ENVIRONMENT: docker
      CACHEPILOT_DATABASE_URL: postgresql+asyncpg://cachepilot:cachepilot@db:5432/cachepilot
      CACHEPILOT_SIMULATED_WORKER_COUNT: "3"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  cachepilot_pgdata:
